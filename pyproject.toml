[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "termix-mcp"
dynamic = ["version"]
description = "MCP server for Termix (self-hosted SSH/RDP/VNC manager), built on termix-sdk"
readme = "README.md"
license = "MIT"
authors = [{ name = "Matheus Alves", email = "sujirodev5@gmail.com" }]
requires-python = ">=3.11,<3.15"
keywords = ["mcp", "termix", "ssh", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=4.0,<5",
    "termix-sdk>=0.2,<0.3",
    "pydantic-settings>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/sujirodev/termix-mcp"
Repository = "https://github.com/sujirodev/termix-mcp"
Issues = "https://github.com/sujirodev/termix-mcp/issues"
Changelog = "https://github.com/sujirodev/termix-mcp/blob/main/CHANGELOG.md"

[project.scripts]
termix-mcp = "termix_mcp.__main__:run"

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
    "mypy>=1.19,<2",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.0,<8",
    "pytest-xdist>=3.8,<4",
    "pytest-timeout>=2.4,<3",
    "jsonschema>=4.23,<5",
    "types-jsonschema>=4.23,<5",
    "respx>=0.22,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/termix_mcp"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
# register_<domain>_tools functions hold many sibling @guarded tool definitions; ruff's
# mccabe walks into those nested defs, so this isn't branching complexity to worry about.
max-complexity = 30

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = [
    "e2e: requires a real Termix instance (testcontainers)",
    "requires_ssh: e2e test that also needs a reachable SSH host",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/termix_mcp"]
