# uv tool install lefthook && lefthook install
pre-commit:
  parallel: true
  commands:
    ruff-check:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    mypy:
      glob: "*.py"
      run: uv run mypy src tests
    lock:
      glob: "pyproject.toml"
      run: uv lock --check
    tool-docs:
      glob: "src/termix_mcp/tools/*.py"
      run: uv run python scripts/generate_tool_docs.py --check

pre-push:
  commands:
    unit:
      run: uv run pytest -q -m "not e2e" -x
