# git-cliff configuration: CHANGELOG.md is generated from Conventional Commits at
# release time (release.yml) and checked into the tag's GitHub Release notes.

[changelog]
header = """# Changelog

Todas as mudancas notaveis deste projeto. Gerado por git-cliff a partir de Conventional Commits.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.breaking %} [**breaking**]{% endif %}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Adicionado" },
  { message = "^fix", group = "<!-- 1 -->Corrigido" },
  { message = "^perf", group = "<!-- 2 -->Desempenho" },
  { message = "^refactor", group = "<!-- 3 -->Refatorado" },
  { message = "^docs", group = "<!-- 4 -->Documentacao" },
  { message = "^test", group = "<!-- 5 -->Testes" },
  { message = "^ci", group = "<!-- 6 -->CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps", group = "<!-- 7 -->Dependencias" },
  { message = "^chore", group = "<!-- 8 -->Manutencao" },
  { body = ".*security", group = "<!-- 1 -->Seguranca" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
