name: Docker

# Multi-arch image on GHCR. `:dev` on every push to main; `vX.Y.Z`, `X.Y` and `latest`
# on a release tag (release.yml calls this after PyPI publish succeeds).

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  UV_LOCKED: "1"
  IMAGE: ghcr.io/sujirodev/termix-mcp

jobs:
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # uv-dynamic-versioning reads the git tag
      # No enable-cache here: this workflow publishes an image, and zizmor flags a
      # restored cache in a publishing job as a cache-poisoning vector.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Build the wheel the image installs
        run: uv build --wheel
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build (smoke) for the runner's arch first
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:smoke
      - run: docker run --rm ${IMAGE}:smoke --version
      - name: Build and push multi-arch
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  badge:
    name: badge
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      # Publishes docker.json to the unprotected `badges` branch; the README's
      # shields.io endpoint badge reads it from raw.githubusercontent.com.
      - name: Publish docker.json to the badges branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi
          printf '{"schemaVersion":1,"label":"ghcr.io","message":"%s","color":"2496ED"}\n' "$VERSION" > docker.json
          git add docker.json
          git commit -m "chore(badge): docker $VERSION"
          git push origin badges
