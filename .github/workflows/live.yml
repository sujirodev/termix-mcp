name: Live smoke

# Weekly, against Termix `:latest` plus a real sshd, so `files`/`docker` tools
# (`requires_ssh`) run too. Never on a PR: an upstream change must not block a merge.

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      termix_image:
        description: "Termix image to test against"
        default: ghcr.io/lukegus/termix:latest

permissions: {}

concurrency:
  group: live-smoke
  cancel-in-progress: false

env:
  UV_LOCKED: "1"

jobs:
  smoke:
    name: smoke
    if: github.repository == 'sujirodev/termix-mcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # opens the failure issue below
    env:
      TERMIX_IMAGE: ${{ inputs.termix_image || 'ghcr.io/lukegus/termix:latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --group dev
      - name: Start Termix and an sshd next to it
        run: docker compose -f docker/e2e/compose.yml -f docker/e2e/compose.ssh.yml up -d --wait
      - name: Run everything, including requires_ssh
        env:
          TERMIX_E2E: "1"
          TERMIX_E2E_BASE_URL: http://localhost:8080
          TERMIX_E2E_PASSWORD: E2e-Live-Aa1-${{ github.run_id }}
          # The sshd container is reachable from Termix's container by service name.
          TERMIX_E2E_SSH_HOST: sshd
          TERMIX_E2E_SSH_PORT: "2222"
          TERMIX_E2E_SSH_USER: ci
          TERMIX_E2E_SSH_PASSWORD: Live-Ssh-Aa1-${{ github.run_id }}
        run: uv run pytest tests/e2e -m e2e -q
      - name: Logs
        if: failure()
        run: docker compose -f docker/e2e/compose.yml -f docker/e2e/compose.ssh.yml logs --no-color --tail=300
      - name: Report the failure as an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create live --color B60205 --description "Weekly live smoke against a real Termix" || true
          existing=$(gh issue list --label live --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Another red run: $RUN_URL"
            exit 0
          fi
          gh issue create --label live \
            --title "Live smoke failed on the weekly schedule" \
            --body "The suite failed against the Termix image it tracks. Run: $RUN_URL"
      - name: Tear down
        if: always()
        run: docker compose -f docker/e2e/compose.yml -f docker/e2e/compose.ssh.yml down -v
