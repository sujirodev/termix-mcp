name: Vulnerability scan

# OSV-Scanner over uv.lock. On a PR: only what the PR introduces. On main and weekly:
# full scan with SARIF upload to Security > Code scanning.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Monday 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  scan-pr:
    name: osv-scanner (PR diff)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --include-git-root
        -r
        ./

  scan-full:
    name: osv-scanner (full)
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
